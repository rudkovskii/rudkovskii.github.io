<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%20fill=%22%2334A948%22><circle%20cx=%2216.0%22%20cy=%228%22%20r=%221.7%22/><circle%20cx=%2211.4%22%20cy=%2214%22%20r=%221.7%22/><circle%20cx=%2216.0%22%20cy=%2214%22%20r=%221.7%22/><circle%20cx=%2220.6%22%20cy=%2214%22%20r=%221.7%22/><circle%20cx=%226.8%22%20cy=%2220%22%20r=%221.7%22/><circle%20cx=%2211.4%22%20cy=%2220%22%20r=%221.7%22/><circle%20cx=%2216.0%22%20cy=%2220%22%20r=%221.7%22/><circle%20cx=%2220.6%22%20cy=%2220%22%20r=%221.7%22/><circle%20cx=%2225.2%22%20cy=%2220%22%20r=%221.7%22/><circle%20cx=%222.2%22%20cy=%2226%22%20r=%221.7%22/><circle%20cx=%226.8%22%20cy=%2226%22%20r=%221.7%22/><circle%20cx=%2211.4%22%20cy=%2226%22%20r=%221.7%22/><circle%20cx=%2216.0%22%20cy=%2226%22%20r=%221.7%22/><circle%20cx=%2220.6%22%20cy=%2226%22%20r=%221.7%22/><circle%20cx=%2225.2%22%20cy=%2226%22%20r=%221.7%22/><circle%20cx=%2229.8%22%20cy=%2226%22%20r=%221.7%22/></svg>">
<meta name="robots" content="noindex, nofollow">
<title>AI-readiness check</title>
<style>
:root{
  --bg:#FFFFFF; --ink:#000000; --accent:#34A948; --accent-2:#62C584;
  --line:#E2E2E2; --muted:#5C5C5C;
  --font:Arial,'Helvetica Neue',Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:660px;margin:0 auto;padding:44px 20px 90px}
h1{font-size:32px;line-height:1.15;font-weight:700;margin:0 0 14px}
.dot{color:var(--accent)}
.disclaimer{border-left:3px solid var(--accent);padding:2px 0 2px 16px;margin:20px 0 36px;font-size:15px;color:var(--muted)}
.optional{font-size:15px;color:var(--muted);margin:0 0 30px}
.q{margin:0 0 34px;padding:0}
.q[hidden]{display:none}
.q h2{font-size:20px;line-height:1.3;font-weight:700;margin:0 0 6px}
.q .req{color:var(--accent);font-weight:700}
.q .note{font-size:15px;color:var(--muted);margin:0 0 14px}
.opts{list-style:none;margin:14px 0 0;padding:0}
.opts li{margin:0 0 9px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:13px 15px;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--accent-2)}
.opt input{margin:2px 0 0;width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.opt.checked{border-color:var(--accent);background:rgba(52,169,72,.05)}
.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.opt span{flex:1}
.opt[hidden]{display:none}
.custom-row{margin-top:8px}
.custom-row[hidden]{display:none}
label.field{display:block;font-weight:700;margin:0 0 8px;font-size:17px}
select,input[type=text],textarea{
  width:100%;font-family:var(--font);font-size:17px;color:var(--ink);
  border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;
}
select:focus,input[type=text]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
textarea{min-height:120px;resize:vertical;line-height:1.45}
.counter{font-size:13px;color:var(--muted);margin-top:6px;text-align:right}
.submit{border-top:1px solid var(--line);margin-top:14px;padding-top:26px}
.nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
button{font-family:var(--font);font-size:16px;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:100px;padding:13px 30px;font-weight:700}
.btn:hover{background:var(--accent-2)}
.btn:disabled{background:#CFCFCF;cursor:not-allowed}
.btn:focus-visible,.btn-ghost:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn-ghost{background:transparent;border:1px solid var(--line);border-radius:100px;padding:12px 22px;color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.status{margin-top:14px;font-size:15px;color:var(--muted)}
.payload{width:100%;min-height:96px;margin-top:14px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.thanks{margin-top:26px;padding:22px;border:1px solid var(--accent);border-radius:16px;background:rgba(52,169,72,.05)}
.thanks[hidden]{display:none}
.thanks h2{margin:0 0 8px;font-size:22px}
.thanks p{margin:0;color:var(--muted);font-size:15px}
.langbar{display:flex;justify-content:flex-end;gap:8px;margin-bottom:18px}
.langbtn{background:none;border:0;color:var(--muted);font-size:14px;padding:4px 6px;border-radius:6px}
.langbtn.active{color:var(--ink);font-weight:700}
.langbtn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
footer{border-top:1px solid var(--line);margin-top:56px;padding-top:18px;font-size:13px;color:var(--muted)}
@media (max-width:520px){
  body{font-size:16px}
  h1{font-size:26px}
  .q h2{font-size:19px}
  .wrap{padding:32px 16px 70px}
  .nav .btn,.nav .btn-ghost{flex:1;text-align:center}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar" id="langbar"></div>
  <header id="head"></header>
  <form id="form" autocomplete="off"></form>
  <div class="submit" id="submit"></div>
  <div class="thanks" id="thanks" hidden></div>
  <footer id="footer"></footer>
</div>

<script>
/* ==========================================================================
   КОНФИГ — правится без программиста.
   Все видимые строки — двуязычные: { e: 'English', r: 'Русский' }.
   LANG выбирает язык по умолчанию; человек может переключить кнопкой сверху.
   Меняешь текст только внутри кавычек. id (слева от текста) не трогать —
   по ним собирается выгрузка.
   ========================================================================== */

const CONFIG = {
  LANG: 'en',                  // язык по умолчанию: 'en' | 'ru'

  SHOW_TRUST_FOR_NEVER: true,  // показывать вопрос про доверие тем, кто не пользуется AI

  // Куда человек относит строку с ответами. Префикс строки — PINELY2- (тот же,
  // что читает decode.html). Если меняешь префикс, поменяй его и в decode.html.
  PAYLOAD_PREFIX: 'PINELY2-',

  // Команды. Порядок как в списке. id (слева) в выгрузке, менять нельзя.
  TEAMS: [
    { id: 'admin_travel', e: 'Administrative Department and Travel', r: 'Административный отдел и командировки' },
    { id: 'finance',      e: 'Finance',                              r: 'Финансы' },
    { id: 'hr',           e: 'HR',                                   r: 'HR' },
    { id: 'legal',        e: 'Legal Compliance & Tax',               r: 'Комплаенс и налоги' },
    { id: 'market_setup', e: 'Market Setup Operations',              r: 'Market Setup Operations' },
    { id: 'regional',     e: 'Regional Directors',                   r: 'Региональные директора' }
  ],

  // Ветвление по ответу на Q2 (частота). Список — какие вопросы показать.
  // Пустой ключ '' — дефолт, если частоту пропустили (показываем всё).
  BRANCHES: {
    never:     ['q3'],
    rarely:    ['q3', 'q4', 'q6', 'q7'],
    regularly: ['q3', 'q4', 'q5', 'q6', 'q7'],
    daily:     ['q3', 'q4', 'q5', 'q6', 'q7'],
    '':        ['q3', 'q4', 'q5', 'q6', 'q7']
  },
  // Короткая ветка: тут прячется пункт agents в Q6 (см. hideInShort у варианта).
  SHORT_FREQ: 'rarely',

  // UI-строки (не вопросы).
  STRINGS: {
    h1:          { e: 'A few questions about AI', r: 'Несколько вопросов про AI' },
    disclaimer:  { e: 'Runs entirely in your browser — nothing is sent automatically. Please keep the free-text field general: no client names, deal figures, or personal data.',
                   r: 'Работает целиком в вашем браузере — ничего не отправляется автоматически. Держите свободное поле в общих словах: без имён клиентов, цифр по сделкам и персональных данных.' },
    optional:    { e: 'Only your team and how often you use AI are needed. Everything else you can skip.',
                   r: 'Обязательны только команда и частота использования AI. Остальное можно пропустить.' },
    teamLabel:   { e: 'Team', r: 'Команда' },
    teamPlaceholder: { e: 'Select your team', r: 'Выберите команду' },
    required:    { e: 'required', r: 'обязательно' },
    customLabel: { e: 'Something else', r: 'Другое' },
    customPlaceholder: { e: 'Type here — separate several with commas', r: 'Впишите здесь — несколько через запятую' },
    copyBtn:     { e: 'Copy my answers', r: 'Скопировать мои ответы' },
    copyHint:    { e: 'It contains your answers only.', r: 'В ней только ваши ответы.' },
    showLine:    { e: 'Show the line', r: 'Показать строку' },
    selectHint:  { e: 'Click the box, then copy it manually.', r: 'Кликните по полю и скопируйте вручную.' },
    copied:      { e: 'Copied. Paste this line into the survey thread in Slack.', r: 'Скопировано. Вставьте эту строку в тред опроса в Slack.' },
    copyFail:    { e: 'Copying was blocked by the browser. Use the box below.', r: 'Копирование заблокировал браузер. Скопируйте из поля ниже.' },
    thanksTitle: { e: 'Thanks for taking this — that is everything.', r: 'Спасибо, это всё.' },
    thanksNote:  { e: 'More about the workshops will follow in Slack.', r: 'Подробнее о воркшопах будет в Slack.' },
    footer:      { e: 'AI-readiness check · prepared by Dmitrii Rudkovskii for Pinely', r: 'AI-readiness check · подготовил Дмитрий Рудковский для Pinely' }
  },

  // Вопросы. kind: 'select' | 'radio' | 'checkbox' | 'text'.
  // Порядок вариантов в одиночном выборе намеренно перемешан (не по нарастанию).
  QUESTIONS: [
    {
      id: 'q2', field: 'freq', kind: 'radio', required: true,
      title: { e: 'How often do you use AI tools — for work or your own things?', r: 'Как часто вы пользуетесь AI-инструментами — по работе или для своего?' },
      note:  { e: 'Claude, ChatGPT, Gemini, Copilot and the like.', r: 'Claude, ChatGPT, Gemini, Copilot и подобные.' },
      options: [
        { id: 'rarely',    e: 'Rarely: I tried it a couple of times, it did not stick', r: 'Редко: пробовал пару раз, не прижилось' },
        { id: 'daily',     e: 'Every day, or almost',                                    r: 'Каждый день или почти' },
        { id: 'never',     e: 'I have never used them',                                  r: 'Никогда не пользовался' },
        { id: 'regularly', e: 'Regularly: a few times a week',                           r: 'Регулярно: несколько раз в неделю' }
      ]
    },
    {
      id: 'q3', field: 'trust', kind: 'radio',
      title: { e: 'How much do you trust AI with your work?', r: 'Насколько вы доверяете AI рабочие задачи?' },
      options: [
        { id: 'small',           e: 'Only for small things, and I still double-check', r: 'Только мелочи, и всё равно перепроверяю' },
        { id: 'everywhere',      e: 'I think it can be used almost anywhere',          r: 'Думаю, его можно применять почти везде' },
        { id: 'none',            e: 'I do not think it can be trusted with anything',  r: 'Не думаю, что ему можно доверять хоть что-то' },
        { id: 'lots_with_check', e: 'For quite a lot, as long as I check the result',  r: 'Многое, если проверяю результат' }
      ]
    },
    {
      id: 'q4', field: 'terms', kind: 'checkbox',
      title: { e: 'Which of these do you understand?', r: 'Что из этого вам понятно?' },
      note:  { e: 'Tick the ones that are clear to you.', r: 'Отметьте то, что вам ясно.' },
      options: [
        { id: 'prompt',         e: 'Prompt',                                                     r: 'Промпт' },
        { id: 'context',        e: 'Context (what the AI already knows in a chat)',              r: 'Контекст (что AI уже знает в чате)' },
        { id: 'hallucination',  e: 'Hallucination (when AI makes something up)',                 r: 'Галлюцинация (когда AI выдумывает)' },
        { id: 'token',          e: 'Token / context window',                                     r: 'Токен / контекстное окно' },
        { id: 'agent',          e: 'The difference between a chatbot and an agent',              r: 'Разница между чат-ботом и агентом' },
        { id: 'system_prompt',  e: 'System prompt / custom instructions',                        r: 'Системный промпт / кастомные инструкции' },
        { id: 'knowledge_base', e: 'Knowledge base / connecting AI to your own documents',       r: 'База знаний / подключение AI к своим документам' },
        { id: 'none',           e: 'None of these yet', r: 'Пока ничего из этого', resetsOthers: true }
      ]
    },
    {
      id: 'q5', field: 'uses', kind: 'checkbox', custom: true,
      title: { e: 'What do you already use AI for at work?', r: 'Для чего вы уже используете AI на работе?' },
      options: [
        { id: 'emails',        e: 'Emails and correspondence',            r: 'Письма и переписка' },
        { id: 'documents',     e: 'Drafting and reviewing documents',     r: 'Черновики и вычитка документов' },
        { id: 'meeting_notes', e: 'Meeting notes and summaries',          r: 'Заметки и саммари встреч' },
        { id: 'research',      e: 'Finding and cross-checking information', r: 'Поиск и перепроверка информации' },
        { id: 'presentations', e: 'Presentations and reports',            r: 'Презентации и отчёты' },
        { id: 'spreadsheets',  e: 'Spreadsheets and calculations',        r: 'Таблицы и расчёты' },
        { id: 'scheduling',    e: 'Planning and scheduling',              r: 'Планирование и расписание' },
        { id: 'translation',   e: 'Translation and proofreading',         r: 'Перевод и вычитка' },
        { id: 'templates',     e: 'Routine documents from templates',     r: 'Типовые документы из шаблонов' },
        { id: 'vendors',       e: 'Vendor and counterparty communication', r: 'Общение с вендорами и контрагентами' },
        { id: 'none',          e: 'Not for any of these yet', r: 'Пока ни для чего из этого', resetsOthers: true }
      ]
    },
    {
      id: 'q6', field: 'interests', kind: 'checkbox', custom: true,
      title: { e: 'What would you be curious to set up with AI?', r: 'Что вам было бы интересно настроить с помощью AI?' },
      options: [
        { id: 'drafts',     e: 'Getting drafts and emails out faster',        r: 'Быстрее выпускать черновики и письма' },
        { id: 'numbers',    e: 'Making sense of spreadsheets and numbers',    r: 'Разбираться с таблицами и цифрами' },
        { id: 'meetings',   e: 'Prepping for meetings and capturing notes',   r: 'Готовиться к встречам и записывать их' },
        { id: 'find',       e: 'Finding and double-checking information',     r: 'Искать и перепроверять информацию' },
        { id: 'templates',  e: 'Templates for things you do again and again', r: 'Шаблоны для того, что делаешь снова и снова' },
        { id: 'automation', e: 'Connecting it to Slack and Google tools',     r: 'Подключить к Slack и Google-инструментам' },
        { id: 'agents',     e: 'Small tools that run a task for you', r: 'Маленькие инструменты, которые выполняют задачу за вас', hideInShort: true },
        { id: 'safety',     e: 'Knowing what is safe to put in',              r: 'Понимать, что безопасно туда закладывать' }
      ]
    },
    {
      id: 'q7', field: 'own_text', kind: 'text', maxlength: 300,
      title: { e: 'What would be interesting to try with AI? Tell us in your own words.', r: 'Что было бы интересно попробовать с AI? Расскажите своими словами.' },
      note:  { e: 'Keep it general — no internal data.', r: 'Держите в общих словах — без внутренних данных.' },
      placeholder: { e: 'Optional', r: 'Необязательно' }
    }
  ]
};

/* ==========================================================================
   Конец конфига. Ниже — механика.
   ========================================================================== */

const STORAGE_KEY = 'pinely_survey_simple_v1';

let LANG = CONFIG.LANG;
let state = {
  team: '', freq: '', trust: '',
  terms: [], uses: [], interests: [],
  uses_custom: '', interests_custom: '',
  own_text: '',
  startedAt: null
};

function tt(x) { return x == null ? '' : (typeof x === 'string' ? x : (LANG === 'ru' ? (x.r || x.e) : x.e)); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function S(key) { return tt(CONFIG.STRINGS[key]); }
function qById(id) { return CONFIG.QUESTIONS.filter(function (q) { return q.id === id; })[0]; }

function save() {
  try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify({ lang: LANG, state: state })); } catch (e) {}
}
function load() {
  try {
    const raw = sessionStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw);
    if (parsed.lang) LANG = parsed.lang;
    if (parsed.state) state = Object.assign(state, parsed.state);
  } catch (e) {}
}

function isShort() { return state.freq === CONFIG.SHORT_FREQ; }

// Список вопросов, видимых при текущей частоте.
function visibleQuestionIds() {
  let branch = CONFIG.BRANCHES[state.freq];
  if (!branch) branch = CONFIG.BRANCHES[''];
  branch = branch.slice();
  if (state.freq === 'never' && !CONFIG.SHOW_TRUST_FOR_NEVER) {
    branch = branch.filter(function (id) { return id !== 'q3'; });
  }
  return branch;
}

function markStarted() { if (!state.startedAt) state.startedAt = Date.now(); }

/* ---------- рендер ---------- */

function renderLangBar() {
  const bar = document.getElementById('langbar');
  bar.innerHTML =
    '<button type="button" class="langbtn' + (LANG === 'en' ? ' active' : '') + '" data-lang="en">EN</button>' +
    '<button type="button" class="langbtn' + (LANG === 'ru' ? ' active' : '') + '" data-lang="ru">RU</button>';
  Array.prototype.forEach.call(bar.querySelectorAll('.langbtn'), function (b) {
    b.onclick = function () { LANG = b.dataset.lang; save(); renderAll(); };
  });
}

function renderHead() {
  document.getElementById('head').innerHTML =
    '<h1>' + esc(S('h1')) + '<span class="dot">.</span></h1>' +
    '<div class="disclaimer">' + esc(S('disclaimer')) + '</div>' +
    '<p class="optional">' + esc(S('optional')) + '</p>';
}

function renderForm() {
  const form = document.getElementById('form');

  // Q1 — Team (select, всегда виден, обязательный).
  const teamOpts = CONFIG.TEAMS.map(function (t) {
    return '<option value="' + esc(t.id) + '"' + (state.team === t.id ? ' selected' : '') + '>' + esc(tt(t)) + '</option>';
  }).join('');
  let html =
    '<section class="q" id="block-q1">' +
    '<label class="field" for="teamSel">' + esc(S('teamLabel')) +
    ' <span class="req">' + esc(S('required')) + '</span></label>' +
    '<select id="teamSel"><option value="">' + esc(S('teamPlaceholder')) + '</option>' + teamOpts + '</select>' +
    '</section>';

  // Остальные вопросы из конфига.
  CONFIG.QUESTIONS.forEach(function (q) {
    html += '<section class="q" id="block-' + q.id + '" data-q="' + q.id + '">' +
      '<h2>' + esc(tt(q.title)) + (q.required ? ' <span class="req">' + esc(S('required')) + '</span>' : '') + '</h2>' +
      (q.note ? '<p class="note">' + esc(tt(q.note)) + '</p>' : '') +
      renderInput(q) +
      '</section>';
  });

  form.innerHTML = html;
  wireForm();
  applyBranching();
}

function renderInput(q) {
  if (q.kind === 'radio' || q.kind === 'checkbox') {
    const type = q.kind === 'radio' ? 'radio' : 'checkbox';
    const items = q.options.map(function (o) {
      const checked = q.kind === 'radio' ? state[q.field] === o.id : state[q.field].indexOf(o.id) >= 0;
      return '<li><label class="opt' + (checked ? ' checked' : '') + '" data-opt="' + o.id + '">' +
        '<input type="' + type + '" name="' + q.id + '" value="' + o.id + '"' + (checked ? ' checked' : '') + '>' +
        '<span>' + esc(tt(o)) + '</span></label></li>';
    }).join('');
    let custom = '';
    if (q.custom) {
      const cf = q.field + '_custom';
      custom =
        '<li><label class="opt" data-opt="__custom__">' +
        '<input type="checkbox" name="' + q.id + '-customchk"' + (state[cf] ? ' checked' : '') + '>' +
        '<span>' + esc(S('customLabel')) + '</span></label>' +
        '<div class="custom-row" id="' + q.id + '-customrow"' + (state[cf] ? '' : ' hidden') + '>' +
        '<input type="text" id="' + q.id + '-custom" maxlength="200" placeholder="' + esc(S('customPlaceholder')) + '" value="' + esc(state[cf]) + '">' +
        '</div></li>';
    }
    return '<ul class="opts">' + items + custom + '</ul>';
  }
  if (q.kind === 'text') {
    return '<textarea id="' + q.id + '-text" maxlength="' + (q.maxlength || 300) + '" placeholder="' + esc(tt(q.placeholder)) + '">' + esc(state[q.field]) + '</textarea>' +
      '<div class="counter"><span id="' + q.id + '-count">' + state[q.field].length + '</span> / ' + (q.maxlength || 300) + '</div>';
  }
  return '';
}

function wireForm() {
  // Team
  const sel = document.getElementById('teamSel');
  sel.onchange = function () { markStarted(); state.team = sel.value; save(); updateSubmit(); };

  CONFIG.QUESTIONS.forEach(function (q) {
    if (q.kind === 'radio') {
      Array.prototype.forEach.call(document.querySelectorAll('input[name="' + q.id + '"]'), function (input) {
        input.onchange = function () {
          markStarted();
          state[q.field] = input.value;
          Array.prototype.forEach.call(document.querySelectorAll('#block-' + q.id + ' .opt'), function (l) { l.classList.remove('checked'); });
          input.closest('.opt').classList.add('checked');
          save();
          if (q.id === 'q2') applyBranching();  // частота управляет ветвлением
          updateSubmit();
        };
      });
    } else if (q.kind === 'checkbox') {
      wireCheckboxGroup(q);
    } else if (q.kind === 'text') {
      const ta = document.getElementById(q.id + '-text');
      ta.oninput = function () {
        markStarted();
        state[q.field] = ta.value;
        document.getElementById(q.id + '-count').textContent = ta.value.length;
        save();
      };
    }
  });
}

function wireCheckboxGroup(q) {
  const noneOpt = q.options.filter(function (o) { return o.resetsOthers; })[0];
  Array.prototype.forEach.call(document.querySelectorAll('input[name="' + q.id + '"]'), function (input) {
    input.onchange = function () {
      markStarted();
      const id = input.value;
      const isNone = noneOpt && id === noneOpt.id;
      if (input.checked && isNone) {
        // «ничего из этого» гасит все остальные галочки и своё поле
        state[q.field] = [noneOpt.id];
        if (q.custom) clearCustom(q);
        syncCheckboxUI(q);
      } else if (input.checked) {
        state[q.field] = state[q.field].filter(function (x) { return !noneOpt || x !== noneOpt.id; });
        if (state[q.field].indexOf(id) < 0) state[q.field].push(id);
        syncCheckboxUI(q);
      } else {
        state[q.field] = state[q.field].filter(function (x) { return x !== id; });
        input.closest('.opt').classList.remove('checked');
      }
      save();
    };
  });
  if (q.custom) wireCustom(q, noneOpt);
}

function wireCustom(q, noneOpt) {
  const cf = q.field + '_custom';
  const chk = document.querySelector('input[name="' + q.id + '-customchk"]');
  const row = document.getElementById(q.id + '-customrow');
  const txt = document.getElementById(q.id + '-custom');
  chk.onchange = function () {
    markStarted();
    row.hidden = !chk.checked;
    chk.closest('.opt').classList.toggle('checked', chk.checked);
    if (chk.checked) {
      // своё поле снимает «ничего из этого»
      if (noneOpt) state[q.field] = state[q.field].filter(function (x) { return x !== noneOpt.id; });
      syncCheckboxUI(q);
      txt.focus();
    } else {
      state[cf] = '';
      txt.value = '';
    }
    save();
  };
  txt.oninput = function () { markStarted(); state[cf] = txt.value; save(); };
}

function clearCustom(q) {
  const cf = q.field + '_custom';
  state[cf] = '';
  const chk = document.querySelector('input[name="' + q.id + '-customchk"]');
  const row = document.getElementById(q.id + '-customrow');
  const txt = document.getElementById(q.id + '-custom');
  if (chk) { chk.checked = false; chk.closest('.opt').classList.remove('checked'); }
  if (row) row.hidden = true;
  if (txt) txt.value = '';
}

// Приводит галочки и подсветку в соответствие с state (после reset-логики).
function syncCheckboxUI(q) {
  Array.prototype.forEach.call(document.querySelectorAll('input[name="' + q.id + '"]'), function (input) {
    const on = state[q.field].indexOf(input.value) >= 0;
    input.checked = on;
    input.closest('.opt').classList.toggle('checked', on);
  });
}

// Показ/скрытие блоков по ветке + пункт agents в короткой ветке.
function applyBranching() {
  const visible = visibleQuestionIds();
  CONFIG.QUESTIONS.forEach(function (q) {
    if (q.id === 'q2') return;                 // Q2 всегда виден
    const block = document.getElementById('block-' + q.id);
    if (block) block.hidden = visible.indexOf(q.id) < 0;
  });
  // agents скрыт в короткой ветке
  const q6 = document.getElementById('block-q6');
  if (q6) {
    qById('q6').options.forEach(function (o) {
      if (!o.hideInShort) return;
      const opt = q6.querySelector('.opt[data-opt="' + o.id + '"]');
      if (opt) opt.parentElement.hidden = isShort();
    });
  }
  updateSubmit();
}

/* ---------- отправка ---------- */

function renderSubmit() {
  document.getElementById('submit').innerHTML =
    '<div class="nav">' +
    '<button class="btn" id="copyBtn" disabled>' + esc(S('copyBtn')) + '</button>' +
    '<button class="btn-ghost" id="showLine" type="button">' + esc(S('showLine')) + '</button>' +
    '</div>' +
    '<div class="status" id="copyStatus" role="status"></div>' +
    '<div id="lineWrap" hidden>' +
    '<p class="status">' + esc(S('selectHint')) + '</p>' +
    '<textarea class="payload" id="payloadBox" readonly></textarea></div>';
  document.getElementById('footer').textContent = S('footer');

  const showLine = document.getElementById('showLine');
  const lineWrap = document.getElementById('lineWrap');
  const box = document.getElementById('payloadBox');
  box.onclick = function () { box.select(); };
  showLine.onclick = function () {
    box.value = encodePayload(buildPayload());
    lineWrap.hidden = false;
    box.select();
  };
  document.getElementById('copyBtn').onclick = onCopy;
  updateSubmit();
}

function updateSubmit() {
  const btn = document.getElementById('copyBtn');
  if (btn) btn.disabled = !(state.team && state.freq);
}

function splitCustom(text) {
  return String(text || '').split(/[,\n;]+/).map(function (s) { return s.trim(); }).filter(Boolean);
}

function buildPayload() {
  const visible = visibleQuestionIds();
  const seen = function (id) { return visible.indexOf(id) >= 0; };
  const p = {
    v: 4,
    variant: 'simple',
    ts: new Date().toISOString(),
    team: state.team,
    freq: state.freq
  };
  if (seen('q3')) p.trust = state.trust;
  if (seen('q4')) p.terms = state.terms.slice();
  if (seen('q5')) { p.uses = state.uses.slice(); p.uses_custom = splitCustom(state.uses_custom); }
  if (seen('q6')) { p.interests = state.interests.slice(); p.interests_custom = splitCustom(state.interests_custom); }
  if (seen('q7')) p.own_text = state.own_text.trim();
  p.duration_sec = state.startedAt ? Math.round((Date.now() - state.startedAt) / 1000) : 0;
  return p;
}

function encodePayload(obj) {
  return CONFIG.PAYLOAD_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
}

function onCopy() {
  const payload = encodePayload(buildPayload());
  const status = document.getElementById('copyStatus');
  const box = document.getElementById('payloadBox');
  const lineWrap = document.getElementById('lineWrap');
  copyText(payload, function (ok) {
    if (ok) {
      status.textContent = S('copied') + ' ' + S('copyHint');
      showThanks();
    } else {
      status.textContent = S('copyFail');
      box.value = payload;
      lineWrap.hidden = false;
      box.select();
    }
  });
}

function showThanks() {
  const t = document.getElementById('thanks');
  t.innerHTML = '<h2>' + esc(S('thanksTitle')) + '</h2>' +
    (S('thanksNote') ? '<p>' + esc(S('thanksNote')) + '</p>' : '');
  t.hidden = false;
  t.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function copyText(text, cb) {
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function () { cb(true); }, function () { cb(fallbackCopy(text)); });
  } else {
    cb(fallbackCopy(text));
  }
}
function fallbackCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

/* ---------- старт ---------- */

function renderAll() {
  document.documentElement.lang = LANG;
  renderLangBar();
  renderHead();
  renderForm();
  renderSubmit();
  document.getElementById('thanks').hidden = true;
}

load();
renderAll();
</script>

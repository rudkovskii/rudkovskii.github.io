<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2032%2032%22%20fill=%22%2334A948%22><circle%20cx=%2216.0%22%20cy=%228%22%20r=%221.7%22/><circle%20cx=%2211.4%22%20cy=%2214%22%20r=%221.7%22/><circle%20cx=%2216.0%22%20cy=%2214%22%20r=%221.7%22/><circle%20cx=%2220.6%22%20cy=%2214%22%20r=%221.7%22/><circle%20cx=%226.8%22%20cy=%2220%22%20r=%221.7%22/><circle%20cx=%2211.4%22%20cy=%2220%22%20r=%221.7%22/><circle%20cx=%2216.0%22%20cy=%2220%22%20r=%221.7%22/><circle%20cx=%2220.6%22%20cy=%2220%22%20r=%221.7%22/><circle%20cx=%2225.2%22%20cy=%2220%22%20r=%221.7%22/><circle%20cx=%222.2%22%20cy=%2226%22%20r=%221.7%22/><circle%20cx=%226.8%22%20cy=%2226%22%20r=%221.7%22/><circle%20cx=%2211.4%22%20cy=%2226%22%20r=%221.7%22/><circle%20cx=%2216.0%22%20cy=%2226%22%20r=%221.7%22/><circle%20cx=%2220.6%22%20cy=%2226%22%20r=%221.7%22/><circle%20cx=%2225.2%22%20cy=%2226%22%20r=%221.7%22/><circle%20cx=%2229.8%22%20cy=%2226%22%20r=%221.7%22/></svg>">
<meta name="robots" content="noindex, nofollow">
<title>Декодер результатов опроса</title>
<style>
:root{--bg:#fff;--ink:#000;--accent:#34A948;--accent-2:#62C584;--line:#E2E2E2;--muted:#5C5C5C;
--font:Arial,'Helvetica Neue',Helvetica,sans-serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5}
.wrap{max-width:1280px;margin:0 auto;padding:28px 20px 80px}
h1{font-size:30px;margin:0 0 8px}
.dot{color:var(--accent)}
p{margin:0 0 14px}
.muted{color:var(--muted);font-size:14px}
textarea{width:100%;min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;
  border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.nav{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0 24px}
button{font-family:var(--font);font-size:15px;cursor:pointer}
.btn{background:var(--accent);color:#fff;border:0;border-radius:100px;padding:11px 26px;font-weight:700}
.btn:hover{background:var(--accent-2)}
.btn-ghost{background:transparent;border:1px solid var(--line);border-radius:100px;padding:10px 22px;color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 22px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:110px}
.stat b{display:block;font-size:26px;line-height:1.2}
.stat span{font-size:13px;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:900px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:#FAFAFA;font-size:12px;text-transform:uppercase;letter-spacing:.04em;position:sticky;top:0}
td.wide{min-width:200px;white-space:normal}
.freqtag{display:inline-block;border-radius:100px;padding:1px 10px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.freqtag.never{background:#F2F2F2}
.freqtag.rarely{background:#F2F2F2}
.freqtag.regularly{background:rgba(98,197,132,.22)}
.freqtag.daily{background:rgba(52,169,72,.28)}
.err{color:#A33;font-size:14px;margin:8px 0}
h2{font-size:20px;margin:34px 0 10px}
ul.freq{list-style:none;padding:0;margin:0;columns:2;font-size:14px}
ul.freq li{margin:0 0 6px;break-inside:avoid}
ul.freq b{color:var(--accent)}
.legacy{margin-top:40px}
.legacy .muted{margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
<h1>Декодер результатов опроса<span class="dot">.</span></h1>
<p class="muted">Вставь строки, собранные из личных сообщений в Slack — по одной на строку. Пустые строки и лишние пробелы игнорируются. Страница работает офлайн, никуда ничего не отправляет.</p>

<textarea id="input" placeholder="PINELY2-eyJ2Ijo0LCJ2YXJpYW50Ijoic2ltcGxlIiwuLi4="></textarea>
<div class="nav">
  <button class="btn" id="decodeBtn">Разобрать</button>
  <button class="btn-ghost" id="csvBtn">Скачать CSV</button>
  <button class="btn-ghost" id="clearBtn">Очистить</button>
</div>

<div id="errors"></div>
<div id="out"></div>
</div>

<script>
const PREFIX = 'PINELY2-';

// Русские подписи для id из опроса. Если добавишь вариант в анкету — допиши сюда,
// иначе в таблице покажется голый id (это не сломает разбор).
const LABELS = {
  team: {
    admin_travel: 'Административный отдел и командировки', finance: 'Финансы', hr: 'HR',
    legal: 'Комплаенс и налоги', market_setup: 'Market Setup Operations', regional: 'Региональные директора'
  },
  freq: { never: 'никогда', rarely: 'редко', regularly: 'регулярно', daily: 'ежедневно' },
  trust: {
    none: 'ничего нельзя доверять', small: 'только мелочи, с проверкой',
    lots_with_check: 'многое, если проверяю', everywhere: 'почти везде'
  },
  terms: {
    prompt: 'промпт', context: 'контекст', hallucination: 'галлюцинация', token: 'токен/окно',
    agent: 'чат-бот vs агент', system_prompt: 'системный промпт', knowledge_base: 'база знаний', none: 'ничего'
  },
  uses: {
    emails: 'письма', documents: 'документы', meeting_notes: 'заметки встреч', research: 'поиск инфо',
    presentations: 'презентации', spreadsheets: 'таблицы', scheduling: 'планирование',
    translation: 'перевод', templates: 'шаблоны', vendors: 'вендоры', none: 'ничего'
  },
  interests: {
    drafts: 'черновики/письма', numbers: 'таблицы/цифры', meetings: 'встречи', find: 'поиск/проверка',
    templates: 'шаблоны', automation: 'Slack/Google', agents: 'мини-инструменты', safety: 'что безопасно класть'
  }
};

let rows = [];  // разобранные payload'ы нового формата (v>=4)
let legacy = []; // старый формат (v<=3), чтобы ничего не потерять

function decodeLine(line) {
  let s = line.trim();
  if (!s) return null;
  if (s.indexOf(PREFIX) === 0) s = s.slice(PREFIX.length);
  s = s.replace(/[^A-Za-z0-9+/=]/g, '');
  return JSON.parse(decodeURIComponent(escape(atob(s))));
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function shortDate(ts) { return ts ? String(ts).slice(0, 16).replace('T', ' ') : ''; }
function label(kind, id) { return (LABELS[kind] && LABELS[kind][id]) || id; }
function labelList(kind, arr) { return (arr || []).map(function (id) { return label(kind, id); }).join(', '); }
function isSimple(r) { return r && (r.variant === 'simple' || (typeof r.v === 'number' && r.v >= 4)); }

function render() {
  const out = document.getElementById('out');
  if (!rows.length && !legacy.length) { out.innerHTML = ''; return; }

  const byFreq = { never: 0, rarely: 0, regularly: 0, daily: 0 };
  const byTeam = {};
  rows.forEach(function (r) {
    if (byFreq[r.freq] !== undefined) byFreq[r.freq]++;
    const t = label('team', r.team);
    byTeam[t] = (byTeam[t] || 0) + 1;
  });

  const head = ['#', 'Дата', 'Команда', 'Частота', 'Доверие', 'Термины', 'Где используют', 'Своё (где)',
    'Интересно настроить', 'Своё (интерес)', 'Свободный текст', 'Сек.'];

  const body = rows.map(function (r, i) {
    return '<tr>' +
      '<td>' + (i + 1) + '</td>' +
      '<td>' + esc(shortDate(r.ts)) + '</td>' +
      '<td>' + esc(label('team', r.team)) + '</td>' +
      '<td><span class="freqtag ' + esc(r.freq || '') + '">' + esc(label('freq', r.freq)) + '</span></td>' +
      '<td>' + esc(r.trust ? label('trust', r.trust) : '') + '</td>' +
      '<td class="wide">' + esc(labelList('terms', r.terms)) + '</td>' +
      '<td class="wide">' + esc(labelList('uses', r.uses)) + '</td>' +
      '<td class="wide">' + esc((r.uses_custom || []).join(', ')) + '</td>' +
      '<td class="wide">' + esc(labelList('interests', r.interests)) + '</td>' +
      '<td class="wide">' + esc((r.interests_custom || []).join(', ')) + '</td>' +
      '<td class="wide">' + esc(r.own_text) + '</td>' +
      '<td>' + esc(r.duration_sec) + '</td>' +
      '</tr>';
  }).join('');

  function freqList(kind, field) {
    const c = {};
    rows.forEach(function (r) { (r[field] || []).forEach(function (id) { const k = label(kind, id); c[k] = (c[k] || 0) + 1; }); });
    return Object.keys(c).sort(function (a, b) { return c[b] - c[a]; })
      .map(function (k) { return '<li><b>' + c[k] + '</b> &mdash; ' + esc(k) + '</li>'; }).join('') || '<li class="muted">нет данных</li>';
  }
  function customList(field) {
    const items = [];
    rows.forEach(function (r) { (r[field] || []).forEach(function (v) { items.push({ team: label('team', r.team), v: v }); }); });
    return items.map(function (x) { return '<li><b>' + esc(x.team) + '</b> &mdash; ' + esc(x.v) + '</li>'; }).join('') || '<li class="muted">нет данных</li>';
  }
  function ownList() {
    const items = rows.filter(function (r) { return r.own_text; });
    return items.map(function (r) { return '<li><b>' + esc(label('team', r.team)) + '</b> &mdash; ' + esc(r.own_text) + '</li>'; }).join('') || '<li class="muted">нет данных</li>';
  }

  const teamTiles = Object.keys(byTeam).sort(function (a, b) { return byTeam[b] - byTeam[a]; })
    .map(function (t) { return '<div class="stat"><b>' + byTeam[t] + '</b><span>' + esc(t) + '</span></div>'; }).join('');

  let html =
    '<div class="stats">' +
    '<div class="stat"><b>' + rows.length + '</b><span>всего ответов</span></div>' +
    '<div class="stat"><b>' + byFreq.never + '</b><span>никогда</span></div>' +
    '<div class="stat"><b>' + byFreq.rarely + '</b><span>редко</span></div>' +
    '<div class="stat"><b>' + (byFreq.regularly + byFreq.daily) + '</b><span>регулярно+ежедневно</span></div>' +
    '</div>' +
    (teamTiles ? '<div class="stats">' + teamTiles + '</div>' : '') +
    (rows.length ? '<div class="tablewrap"><table><thead><tr>' + head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + body + '</tbody></table></div>' : '') +
    (rows.length ? '<h2>Понимание терминов</h2><ul class="freq">' + freqList('terms', 'terms') + '</ul>' +
      '<h2>Где AI уже используют</h2><ul class="freq">' + freqList('uses', 'uses') + '</ul>' +
      '<h2>Что интересно настроить</h2><ul class="freq">' + freqList('interests', 'interests') + '</ul>' +
      '<h2>Свои варианты — где используют</h2><ul class="freq">' + customList('uses_custom') + '</ul>' +
      '<h2>Свои варианты — что интересно</h2><ul class="freq">' + customList('interests_custom') + '</ul>' +
      '<h2>Свободный текст</h2><ul class="freq">' + ownList() + '</ul>' : '');

  if (legacy.length) {
    const lbody = legacy.map(function (r, i) {
      return '<tr><td>' + (i + 1) + '</td><td>' + esc(shortDate(r.ts)) + '</td><td>' + esc(r.team) +
        '</td><td>' + esc(r.level != null ? r.level : '') + '</td><td>' + esc(r.path || '') + '</td></tr>';
    }).join('');
    html += '<div class="legacy"><h2>Старый формат (подробный опрос)</h2>' +
      '<p class="muted">Эти строки пришли со старой версии опроса. Показываю, чтобы не потерялись.</p>' +
      '<div class="tablewrap"><table><thead><tr><th>#</th><th>Дата</th><th>Команда</th><th>Уровень</th><th>Версия</th></tr></thead><tbody>' +
      lbody + '</tbody></table></div></div>';
  }

  out.innerHTML = html;
}

function toCSV() {
  const cols = ['n', 'ts', 'team', 'freq', 'trust', 'terms', 'uses', 'uses_custom', 'interests', 'interests_custom', 'own_text', 'duration_sec'];
  const lines = [cols.join(',')];
  rows.forEach(function (r, i) {
    const vals = [i + 1, r.ts, label('team', r.team), label('freq', r.freq), r.trust ? label('trust', r.trust) : '',
      labelList('terms', r.terms), labelList('uses', r.uses), (r.uses_custom || []).join('; '),
      labelList('interests', r.interests), (r.interests_custom || []).join('; '), r.own_text, r.duration_sec];
    lines.push(vals.map(function (v) {
      const s = v == null ? '' : String(v);
      return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(','));
  });
  return '﻿' + lines.join('\n');
}

document.getElementById('decodeBtn').onclick = function () {
  const lines = document.getElementById('input').value.split(/\r?\n/);
  const errs = [];
  rows = []; legacy = [];
  lines.forEach(function (line, i) {
    if (!line.trim()) return;
    try {
      const obj = decodeLine(line);
      if (!obj) return;
      if (isSimple(obj)) rows.push(obj); else legacy.push(obj);
    } catch (e) {
      errs.push('Строка ' + (i + 1) + ' не разобралась: ' + e.message);
    }
  });
  document.getElementById('errors').innerHTML = errs.map(function (e) { return '<p class="err">' + esc(e) + '</p>'; }).join('');
  render();
};

document.getElementById('csvBtn').onclick = function () {
  if (!rows.length) { alert('Сначала нажми «Разобрать» — строк нового формата нет.'); return; }
  const blob = new Blob([toCSV()], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pinely-survey.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
};

document.getElementById('clearBtn').onclick = function () {
  document.getElementById('input').value = '';
  document.getElementById('errors').innerHTML = '';
  rows = []; legacy = [];
  render();
};
</script>
</body>
</html>
